name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # No real credentials here on purpose. Telegram and Resend are left unset so
    # those channels report "not-configured" and cannot send; the CRM points at
    # the local mock in e2e/crm-mock.ts. A test run must never message the shop.
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
      CRM_WEBHOOK_TOKEN: e2e-test-token
      CRM_WEBHOOK_URL: http://127.0.0.1:4571/crm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # playwright.config.ts builds and starts the app itself via `webServer`,
      # so this covers `next build` too — a build failure fails the job here.
      - name: End-to-end tests
        run: npm test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
